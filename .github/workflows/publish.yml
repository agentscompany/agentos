# Publica ghcr.io/agentscompany/agentos:<versão> (arm64 + amd64) a cada tag vAAAA.MM.N.
name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version: { description: "versão (ex.: 2026.10.1)", required: true }

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Driver version
        id: driver
        run: echo "ref=$(cat DRIVER_VERSION)" >> "$GITHUB_OUTPUT"
      # The driver is a private repository: read with a read-only deploy key (DRIVER_DEPLOY_KEY) or a fine-grained
      # token limited to reading it (DRIVER_TOKEN). Neither is printed.
      - uses: actions/checkout@v4
        with:
          repository: agentscompany/driver
          ref: ${{ steps.driver.outputs.ref }}
          path: driver
          ssh-key: ${{ secrets.DRIVER_DEPLOY_KEY }}
          token: ${{ secrets.DRIVER_TOKEN || github.token }}
          persist-credentials: false
      - name: Versão
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Montar e publicar
        run: |
          docker buildx build --platform linux/arm64,linux/amd64 \
            --label org.opencontainers.image.source=https://github.com/agentscompany/agentos \
            -t ghcr.io/agentscompany/agentos:${{ steps.v.outputs.version }} \
            -t ghcr.io/agentscompany/agentos:latest --push .
